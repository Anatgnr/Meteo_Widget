[package]
name = "weatherglass"
version = "0.1.0"
description = "Widget météo intelligent et discret pour Windows 11"
authors = ["WeatherGlass"]
edition = "2021"

[lib]
name = "weatherglass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-window-state = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
