[package]
name = "weatherglass"
version = "0.1.0"
description = "Widget météo transparent pour Windows et Linux"
authors = ["WeatherGlass"]
edition = "2021"

[lib]
name = "weatherglass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
