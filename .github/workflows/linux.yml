name: Linux build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libfuse2
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --release --lib --locked
      - run: bash Installer-WeatherGlass.sh --build-only --rebuild
      - uses: actions/upload-artifact@v4
        with:
          name: WeatherGlass-Linux
          path: |
            release/WeatherGlass.deb
            release/WeatherGlass.AppImage
          if-no-files-found: error
